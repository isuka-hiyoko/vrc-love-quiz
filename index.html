<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VRC恋愛理解度診断</title>
<meta name="description" content="2択でランダム25問、あの人のことをどれだけわかっているか診断。何度でも挑戦できて、ランキングと理解度の推移が見られます。">
<meta property="og:url" content="https://isuka-hiyoko.github.io/vrc-love-quiz/">
<meta property="og:image" content="https://isuka-hiyoko.github.io/vrc-love-quiz/ogp.png">

<style>
:root{--bg:#1E1838;--surface:#2A2250;--line:#3D3370;--text:#EDE7FF;--muted:#A99FD0;--pink:#FF8FB8;--mint:#8FE3CF;--sel:#43305F}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#3A2C6E 0%,var(--bg) 60%) fixed,var(--bg);color:var(--text);font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans',sans-serif;-webkit-text-size-adjust:100%}
.trial{background:var(--pink);color:var(--bg);text-align:center;font-size:13px;font-weight:700;padding:6px 16px}
#app{max-width:520px;margin:0 auto;padding:20px 16px 56px}
h1,h2{margin:0;font-weight:900;line-height:1.35}
p{line-height:1.6}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:grid;gap:12px}
.btn{display:block;width:100%;padding:14px;border-radius:14px;border:none;font:inherit;font-weight:700;font-size:16px;cursor:pointer;text-align:center;text-decoration:none}
.primary{background:var(--pink);color:#2A1030}
.primary:disabled{opacity:.4;cursor:not-allowed}
.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)}
.xbtn{background:#000;color:#fff;border:1.5px solid #555}
.link{background:none;border:none;color:var(--muted);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer;padding:8px 4px}
.input{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:16px}
.input:focus{outline:none;border-color:var(--pink)}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:18px}
.opt{width:100%;min-height:120px;padding:16px;border-radius:18px;border:2px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:17px;font-weight:700;cursor:pointer;line-height:1.5}
.opt:active,.opt.on{border-color:var(--pink);background:var(--sel)}
.chip{padding:7px 10px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--text);font:inherit;font-size:13px;cursor:pointer;text-align:left;line-height:1.45}
.chip.on{border-color:var(--mint);background:#24474A;color:var(--mint);font-weight:700}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);font:inherit;cursor:pointer;text-align:left}
.row.me{border-color:var(--pink)}
.row.top{background:#4A2F5E;border-color:var(--pink)}
.err{color:var(--pink);font-size:14px;margin:0}
.bar{display:flex;justify-content:space-between;align-items:center}
.urlbox{word-break:break-all;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
button:focus-visible,a:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .5s ease-out}@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}}
</style>
</head>
<body>
<div class="trial">試験運用中：突然変更が入る場合があります</div>
<div id="app"><p class="muted" style="text-align:center;margin-top:80px">読み込み中…</p></div>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzWvgCo6UYgwfJby1sz4lJ8oa-WgJXhXTHjxacQtTP7U-4nYWcmNineRIBVqkozSaKD/exec";
const TOTAL = 25;   // 1回の挑戦で出題する問題数（Code.gs の ASK と同じ）
const MAX_Q = 100;  // 登録できる問題の上限（Code.gs の MAX_QUESTIONS と同じ）
const QUIZ_TITLE = "VRC恋愛理解度診断"; // 診断名は固定
const HASHTAG = "VRC恋愛理解度診断";

// 問題プール [質問, A, B, カテゴリ]（出題者についての質問・5カテゴリ×10問）
const POOL = [
  ["理想のデート場所は？","綺麗系ワールド","チルワ","デート"],
  ["デートの計画は？","しっかり決めたい","その場のノリで","デート"],
  ["ワールド選びは？","自分が案内したい","案内してほしい","デート"],
  ["二人で過ごすなら？","まったり雑談","ゲームワールドで遊ぶ","デート"],
  ["ゲームワールドで遊ぶなら？","協力系","対戦系","デート"],
  ["遊ぶなら？","二人きり","みんなでわいわい","デート"],
  ["好きなワールドの雰囲気は？","和風・自然","近未来・サイバー","デート"],
  ["会い方は？","短くても毎日会いたい","たまに長時間じっくり","デート"],
  ["寝る前は？","一緒に寝落ちしたい","ちゃんと挨拶して解散","デート"],
  ["写真撮影は？","二人の写真をたくさん撮りたい","その瞬間を楽しみたい","デート"],
  ["パートナーになる前の招待は？","気にせず送る","気にする","会話・連絡"],
  ["会話スタイルは？","ボイスでたくさん話したい","無言の時間も心地いい","会話・連絡"],
  ["デート中の会話は？","話し役","聞き役","会話・連絡"],
  ["喧嘩したら？","すぐ話し合いたい","少し時間を置きたい","会話・連絡"],
  ["寂しいときは？","素直に言う","言わずに我慢しがち","会話・連絡"],
  ["悩みがあるときは？","聞いてほしい","一人で整理したい","会話・連絡"],
  ["パートナーの呼び方は？","あだ名","名前そのまま","会話・連絡"],
  ["返信が遅いときは？","気にならない","ちょっと気になる","会話・連絡"],
  ["作業中は？","作業通話でつながりたい","一人で集中したい","会話・連絡"],
  ["不満を伝えるなら？","その場ですぐ","落ち着いてから","会話・連絡"],
  ["なでなでは？","したい","されたい","愛情表現"],
  ["ハグは？","大好き","ちょっと照れる","愛情表現"],
  ["愛情表現は？","言葉で伝えてほしい","行動で示してほしい","愛情表現"],
  ["「好き」と言うのは？","毎日でも言いたい","大事なときだけ","愛情表現"],
  ["告白は？","自分からしたい","されたい","愛情表現"],
  ["照れたときは？","素直に挙動に出る","平静を装う","愛情表現"],
  ["甘えるのは？","得意","苦手","愛情表現"],
  ["理想の距離感は？","いつもくっついていたい","ほどよい距離がいい","愛情表現"],
  ["プレゼントは？","形に残るもの","体験や時間","愛情表現"],
  ["サプライズは？","うれしい","事前に知りたい","愛情表現"],
  ["嫉妬は？","少しはしてほしい","しないでほしい","価値観"],
  ["パートナーが他の人と盛り上がっていたら？","平気","ちょっとモヤモヤ","価値観"],
  ["フレンドとの時間は？","パートナーを最優先したい","フレンドも大事","価値観"],
  ["お砂糖/パートナーの公表は？","みんなに言いたい","二人だけの秘密","価値観"],
  ["記念日は？","大事にしたい","あまり気にしない","価値観"],
  ["将来の話は？","したい","今を楽しみたい","価値観"],
  ["理想の関係は？","パートナー兼親友","パートナー兼恋人","価値観"],
  ["リアルの話は？","知りたい","VRCの中だけで十分","価値観"],
  ["好きなタイプは？","甘えてくれる人","引っ張ってくれる人","価値観"],
  ["恋愛で大事なのは？","安心感","ドキドキ","価値観"],
  ["好きなアバターの雰囲気は？","かわいい系","かっこいい系","VRCライフ"],
  ["第一印象で見るのは？","見た目（アバター）","声・話し方","VRCライフ"],
  ["おそろいアイテムは？","揃えたい","それぞれ好きなものがいい","VRCライフ"],
  ["パートナーのアバター改変は？","一緒に考えたい","本人の自由","VRCライフ"],
  ["よくインする時間は？","深夜まで夜更かし","早めの時間","VRCライフ"],
  ["パートナーのステータスは？","オレンジだと気になる","気にならない","VRCライフ"],
  ["イベントは？","一緒に参加したい","それぞれ楽しめばいい","VRCライフ"],
  ["パートナーのフレンドとは？","積極的にフレンドになりたい","慎重","VRCライフ"],
  ["二人で過ごすインスタンスは？","フレンド+で誰か来てもいい","インバイトで二人きり","VRCライフ"],
  ["ログインしたら？","まずパートナーのところへ","自分のペースで過ごしてから","VRCライフ"],
];
const CATS = ["デート","会話・連絡","愛情表現","価値観","VRCライフ"];

// ---------- utils ----------
const $app = document.getElementById("app");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const baseUrl = () => location.origin + location.pathname;
const quizUrl = (id) => baseUrl() + "?q=" + encodeURIComponent(id);
const pad = (n) => String(n).padStart(2, "0");
const fmtDate = (ts) => { const d = new Date(ts); return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`; };
const fmtTime = (ts) => { const d = new Date(ts); return `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${pad(d.getMinutes())}`; };
const tier = (p) => p >= 90 ? "以心伝心レベル" : p >= 70 ? "かなりわかってる" : p >= 50 ? "まだまだ伸びしろあり" : "これから知っていこう";
const xIntent = (text, url) => "https://twitter.com/intent/tweet?text=" + encodeURIComponent(text) + "&url=" + encodeURIComponent(url) + "&hashtags=" + encodeURIComponent(HASHTAG);

async function api(action, payload) {
  const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action, ...payload }) });
  if (!res.ok) throw new Error("通信に失敗しました。時間をおいてもう一度お試しください。");
  const j = await res.json();
  if (!j.ok) throw new Error(j.error);
  return j.data;
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch {
    const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch {} t.remove(); return ok;
  }
}

// 自分が作った診断（編集キー）を端末に保存
const myQuizzes = () => ls.get("myQuizzes", []);
function saveMine(id, creator, key) {
  const list = myQuizzes().filter((x) => x.id !== id);
  list.unshift({ id, creator, key }); ls.set("myQuizzes", list);
}
const keyFor = (id) => (myQuizzes().find((x) => x.id === id) || {}).key;

// 回答者の本人確認用の鍵（端末ごと）。別の端末で同じ名前を使うときは、確認してから付け替える
function playerKey() {
  let k = ls.get("playerKey", "");
  if (!k) {
    const b = new Uint8Array(16); crypto.getRandomValues(b);
    k = Array.from(b, (x) => x.toString(16).padStart(2, "0")).join(""); ls.set("playerKey", k);
  }
  return k;
}

// 診断ごとに使った名前を覚える（新しい診断では最後に使った名前を入れておく）
const nameFor = (id) => ls.get("names", {})[id] || ls.get("name", "");
function saveName(id, n) {
  const m = ls.get("names", {}); m[id] = n; ls.set("names", m); ls.set("name", n);
}

// ---------- state ----------
const S = {
  view: "loading", id: null, quiz: null, err: "",
  name: ls.get("name", ""), idx: 0, answers: [], questions: [], token: null, result: null,
  ranking: null, detail: null, stats: null, ed: null, created: null, toast: "", confirm: "",
};
function go(view, patch) { Object.assign(S, patch || {}, { view, err: "" }); render(); window.scrollTo(0, 0); }
function setErr(e) { S.err = e.message || String(e); render(); }

// ---------- views ----------
function vLanding() {
  const mine = myQuizzes();
  return `
  <div style="text-align:center;padding:40px 0 28px">
    <div style="font-size:40px" aria-hidden="true">💞</div>
    <h1 style="font-size:30px;margin-top:8px;letter-spacing:.04em">VRC恋愛理解度診断</h1>
    <p class="muted" style="margin:8px 0 0">あなたについての2択に${TOTAL}問以上答えて、Xで配ろう。<br>みんながどれだけあなたをわかっているか、ランキングでわかります。</p>
  </div>
  <div class="stack">
    <button class="btn primary" data-act="newQuiz">診断をつくる</button>
  </div>
  ${mine.length ? `<h2 style="font-size:18px;margin:32px 0 10px">この端末でつくった診断</h2>
    <div class="stack">${mine.map((m) => `<a class="row" href="?q=${esc(m.id)}"><span style="flex:1;font-weight:700">${esc(m.creator ? m.creator + "さんの診断" : m.title)}</span><span class="muted small">開く</span></a>`).join("")}</div>` : ""}
  ${S.err ? `<p class="err" style="margin-top:12px">${esc(S.err)}</p>` : ""}`;
}

function vHome() {
  const z = S.quiz, mine = keyFor(z.id);
  return `
  <div style="text-align:center;padding:36px 0 26px">
    <div style="font-size:40px" aria-hidden="true">💞</div>
    <h1 style="font-size:28px;margin-top:8px">${QUIZ_TITLE}</h1>
    <p class="muted" style="margin:8px 0 0">${esc(z.creator)}さんならどっちを選ぶ？<br>${z.poolSize > z.ask ? `${z.poolSize}問の中からランダムに${z.ask}問、` : `${z.ask}問の`}2択で理解度を診断します。<br>挑戦は1日1回${z.poolSize > z.ask ? "。毎回問題が変わります" : ""}。</p>
  </div>
  <div class="stack">
    <label class="muted small" for="nm">あなたの名前（ランキングに表示されます）</label>
    <input id="nm" class="input" maxlength="20" value="${esc(S.name)}" placeholder="名前を入力" data-bind="name">
    ${S.confirm ? `<div class="card" style="border-color:var(--pink)">
      <p style="margin:0 0 12px">「${esc(S.confirm)}」は、別の端末（または別のブラウザ）で使われている名前です。<br>あなた本人なら、このまま続けてください。記録も引き継がれます。</p>
      <div class="stack">
        <button class="btn primary" data-act="start" data-takeover="1">本人なので続ける</button>
        <button class="btn ghost" data-act="cancelConfirm">別の名前にする</button>
      </div>
    </div>` : `<button class="btn primary" data-act="start">診断をはじめる</button>`}
    <button class="btn ghost" data-act="ranking">ランキングを見る</button>
    ${S.err ? `<p class="err">${esc(S.err)}</p>` : ""}
  </div>
  <div style="text-align:center;margin-top:28px">
    ${mine ? `<button class="link" data-act="stats">みんなの一致率を見る</button><br><button class="link" data-act="editQuiz">この診断を編集する</button><br>` : ""}
    <a class="link" href="${esc(baseUrl())}">自分の診断をつくる</a>
  </div>`;
}

function vQuiz() {
  const qs = S.questions, q = qs[S.idx];
  return `
  <div class="bar">
    <button class="link" data-act="${S.idx ? "prev" : "home"}">${S.idx ? "前の問題" : "やめる"}</button>
    <span class="muted small">${S.idx + 1} / ${qs.length}</span>
  </div>
  <div style="height:6px;background:var(--line);border-radius:3px;margin:8px 0 26px">
    <div style="height:6px;width:${((S.idx + 1) / qs.length) * 100}%;background:var(--pink);border-radius:3px;transition:width .25s"></div>
  </div>
  <p class="muted small" style="margin:0 0 4px">${esc(S.quiz.creator)}さんなら？</p>
  <h2 style="font-size:23px;min-height:70px;margin-bottom:20px">${esc(q.q)}</h2>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
    ${["a", "b"].map((k) => `<button class="opt ${S.answers[S.idx] === k ? "on" : ""}" data-act="choose" data-k="${k}">${esc(q[k])}</button>`).join("")}
  </div>`;
}

function vSending() {
  return `<p class="muted" style="text-align:center;margin-top:80px">採点中…</p>${S.err ? `<div class="stack"><p class="err" style="text-align:center">${esc(S.err)}</p><button class="btn primary" data-act="resend">もう一度送信する</button><button class="link" data-act="home">トップに戻る</button></div>` : ""}`;
}

function vResult() {
  const r = S.result, z = S.quiz;
  const text = `「${QUIZ_TITLE}」で、${z.creator}さんへの理解度は${r.pct}%でした（${r.count}人中${r.rank}位）`;
  return `
  <div style="text-align:center;padding-top:36px">
    <p class="muted" style="margin:0">${esc(r.name)} さんの理解度</p>
    <div class="pop" style="font-size:88px;font-weight:900;color:var(--pink);line-height:1.1;margin:8px 0">${r.pct}<span style="font-size:36px">%</span></div>
    <p style="font-size:20px;font-weight:700;margin:0 0 4px">${tier(r.pct)}</p>
    <p class="muted" style="margin:0 0 26px">${r.total}問中 ${r.score}問一致・${r.count}人中 ${r.rank}位</p>
    <div class="stack">
      <a class="btn xbtn" href="${esc(xIntent(text, quizUrl(z.id)))}" target="_blank" rel="noopener">結果をXにポストする</a>
      <button class="btn primary" data-act="ranking">ランキングを見る</button>
      <button class="btn ghost" data-act="myHistory">自分の推移を見る</button>
      <p class="muted small" style="margin:4px 0 0">次の挑戦は明日からできます。</p>
      <button class="link" data-act="home">トップに戻る</button>
    </div>
  </div>`;
}

function vRanking() {
  const rows = S.ranking;
  return `
  <div class="bar"><button class="link" data-act="home">トップに戻る</button><button class="link" data-act="ranking">更新</button></div>
  <h2 style="font-size:26px;margin:8px 0 4px">ランキング</h2>
  <p class="muted small" style="margin:0 0 18px">${esc(S.quiz.creator)}さんの診断｜各自の最新の挑戦結果で順位をつけています。名前をタップするとその人の推移が見られます。</p>
  ${S.err ? `<p class="err">${esc(S.err)}</p>` : ""}
  ${rows === null ? `<p class="muted">読み込み中…</p>`
    : rows.length === 0 ? `<div class="card muted">まだ誰も挑戦していません。最初の挑戦者になろう。</div>`
    : `<div class="stack" style="gap:8px">${rows.map((r, i) => `
      <button data-act="detail" data-i="${i}" class="row ${r.rank === 1 ? "top" : ""} ${r.name === S.name.trim() ? "me" : ""}">
        <span style="width:34px;font-size:${r.rank === 1 ? 22 : 18}px;font-weight:900;color:${r.rank === 1 ? "var(--pink)" : "var(--muted)"}">${r.rank}</span>
        <span style="flex:1;min-width:0">
          <span style="display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name)}</span>
          <span class="muted" style="font-size:12px">${fmtDate(r.ts)}・挑戦${r.count}回</span>
        </span>
        <span style="font-size:22px;font-weight:900">${r.pct}<span style="font-size:13px">%</span></span>
      </button>`).join("")}</div>`}`;
}

function chartSvg(data) {
  const W = 340, H = 220, L = 36, R = 14, T = 12, B = 30;
  const n = data.length, iw = W - L - R, ih = H - T - B;
  const x = (i) => L + (n === 1 ? iw / 2 : (iw * i) / (n - 1));
  const y = (p) => T + ih - (ih * p) / 100;
  const grid = [0, 25, 50, 75, 100].map((v) => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#3D3370" stroke-dasharray="3 3"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#A99FD0">${v}</text>`).join("");
  const step = Math.max(1, Math.ceil(n / 5));
  const labels = data.map((d, i) => (i % step === 0 || i === n - 1) ? `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="#A99FD0">${fmtTime(d.ts).split(" ")[0]}</text>` : "").join("");
  const path = data.map((d, i) => `${i ? "L" : "M"}${x(i)},${y(d.pct)}`).join(" ");
  const dots = data.map((d, i) => `<circle cx="${x(i)}" cy="${y(d.pct)}" r="5" fill="#FF8FB8"><title>${fmtTime(d.ts)} ${d.pct}%</title></circle>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="理解度の推移グラフ">${grid}${labels}<path d="${path}" fill="none" stroke="#FF8FB8" stroke-width="3" stroke-linejoin="round"/>${dots}</svg>`;
}

function vDetail() {
  const d = S.detail;
  const back = d.back === "result" ? `<button class="link" data-act="backResult">結果に戻る</button>` : `<button class="link" data-act="ranking">ランキングに戻る</button>`;
  if (!d.data || !d.data.length) return `${back}${S.err ? `<p class="err">${esc(S.err)}</p>` : `<p class="muted">読み込み中…</p>`}`;
  const best = Math.max(...d.data.map((a) => a.pct)), latest = d.data[d.data.length - 1];
  return `
  ${back}
  <h2 style="font-size:24px;margin:8px 0 4px;word-break:break-all">${esc(d.name)}</h2>
  <p class="muted small" style="margin:0 0 16px">最新 ${latest.pct}%・最高 ${best}%・挑戦 ${d.data.length}回</p>
  <div class="card" style="padding:12px 6px">${chartSvg(d.data)}</div>
  <div style="margin-top:16px">${[...d.data].reverse().map((a) => `
    <div style="display:flex;justify-content:space-between;padding:9px 4px;border-bottom:1px solid var(--line);font-size:14px">
      <span class="muted">${fmtDate(a.ts)} ${new Date(a.ts).getHours()}:${pad(new Date(a.ts).getMinutes())}</span><span style="font-weight:700">${a.pct}%</span>
    </div>`).join("")}</div>`;
}

function vEdit() {
  const e = S.ed, cnt = Object.keys(e.sel).length, ans = Object.values(e.sel).filter(Boolean).length;
  const catCount = [...CATS, "オリジナル"].map((c) => `${c} ${e.pool.filter((p) => p.cat === c && p.q in e.sel).length}`).join("　");
  const shown = e.pool.map((p, i) => [p, i]).filter(([p]) => !e.onlySel || p.q in e.sel);
  const ready = cnt >= TOTAL && cnt <= MAX_Q && ans === cnt;
  return `
  <button class="link" data-act="${e.id ? "home" : "landing"}">戻る</button>
  <h2 style="font-size:24px;margin:8px 0 16px">${e.id ? "診断を編集する" : "診断をつくる"}</h2>
  <div class="stack" style="margin-bottom:18px">
    <label class="muted small">あなたの名前（出題者として表示されます）
      <input class="input" style="margin-top:6px" maxlength="20" value="${esc(e.creator)}" data-bind="ed.creator"></label>
  </div>
  <div style="position:sticky;top:0;z-index:2;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:12px">
    <div class="bar">
      <span style="font-weight:700">選択 <span style="color:${cnt >= TOTAL ? "var(--mint)" : "var(--pink)"}">${cnt}</span>問・解答 ${ans}/${cnt}</span>
      <button class="chip ${e.onlySel ? "on" : ""}" data-act="onlySel">選択中だけ表示</button>
    </div>
    <p class="muted" style="font-size:12px;margin:6px 0 0">${catCount}</p>
  </div>
  <p class="muted small" style="margin:0 0 12px">問題をタップして選び、あなた自身の答えをA・Bから選んでください。${TOTAL}問以上なら何問でも選べます。${TOTAL}問より多いと、挑戦のたびにその中からランダムに${TOTAL}問出題されます。</p>
  <div class="stack" style="gap:8px">
    ${shown.map(([p, i]) => {
      const on = p.q in e.sel;
      return `<div class="card" style="padding:12px;border-color:${on ? "var(--pink)" : "var(--line)"}">
        <div style="display:flex;gap:8px;align-items:flex-start">
          <button class="chip ${on ? "on" : ""}" style="flex:1" data-act="toggle" data-i="${i}" aria-pressed="${on}">${on ? "✓ " : ""}${esc(p.q)}</button>
          ${p.custom ? `<button class="link" style="font-size:12px;padding:4px" data-act="delCustom" data-i="${i}">削除</button>` : ""}
        </div>
        ${on ? `<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px">${["a", "b"].map((k) => `<button class="chip ${e.sel[p.q] === k ? "on" : ""}" data-act="setAns" data-i="${i}" data-k="${k}">${k.toUpperCase()}：${esc(p[k])}</button>`).join("")}</div>` : ""}
        <p class="muted" style="font-size:12px;margin:6px 0 0">${esc(p.cat)}${on ? "" : `｜A：${esc(p.a)}　B：${esc(p.b)}`}</p>
      </div>`;
    }).join("")}
  </div>
  <div class="card stack" style="margin-top:18px;gap:8px">
    <span style="font-weight:700">オリジナル問題を追加</span>
    <input class="input" placeholder="質問" maxlength="60" data-bind="ed.nq.q" value="${esc(e.nq.q)}">
    <input class="input" placeholder="選択肢A" maxlength="40" data-bind="ed.nq.a" value="${esc(e.nq.a)}">
    <input class="input" placeholder="選択肢B" maxlength="40" data-bind="ed.nq.b" value="${esc(e.nq.b)}">
    <button class="btn ghost" data-act="addCustom">追加する</button>
  </div>
  <div class="stack" style="margin-top:20px;gap:8px">
    <p class="muted small" style="margin:0">あなたの答えは、運営者がデータを開いても読めない形で保存されます。回答者にも答えは表示されません。</p>
    ${e.id ? `<p class="muted small" style="margin:0">問題や答えを変えて保存しても、ランキングはリセットされません。答えを変えた場合、これまでの記録の点数はそのまま残ります。</p>` : ""}
    ${S.err ? `<p class="err">${esc(S.err)}</p>` : ""}
    <button class="btn primary" data-act="saveQuiz" ${ready && !e.busy ? "" : "disabled"}>
      ${e.busy ? "保存中…" : ready ? (e.id ? "変更を保存する" : "診断を公開する") : cnt < TOTAL ? `あと${TOTAL - cnt}問選んでください` : cnt > MAX_Q ? `${MAX_Q}問以内にしてください` : "すべての答えを選んでください"}
    </button>
  </div>`;
}

function vCreated() {
  const c = S.created, url = quizUrl(c.id), edit = url + "#k=" + c.key;
  const text = `${c.creator}のことをどれだけわかってる？「${QUIZ_TITLE}」に挑戦してね`;
  return `
  <div style="text-align:center;padding:32px 0 20px">
    <div style="font-size:40px" aria-hidden="true">🎉</div>
    <h2 style="font-size:26px;margin-top:8px">${c.updated ? "保存しました" : "診断を公開しました"}</h2>
  </div>
  <div class="stack">
    <a class="btn xbtn" href="${esc(xIntent(text, url))}" target="_blank" rel="noopener">Xで診断を配る</a>
    <div class="card stack" style="gap:8px">
      <span style="font-weight:700">診断のURL</span>
      <div class="urlbox">${esc(url)}</div>
      <button class="btn ghost" data-act="copy" data-v="${esc(url)}">URLをコピー</button>
    </div>
    <div class="card stack" style="gap:8px">
      <span style="font-weight:700">編集用URL（誰にも教えないでください）</span>
      <p class="muted small" style="margin:0">このURLを開くと、別の端末からでも編集できます。なくすと編集できなくなるので、メモに保存してください。</p>
      <div class="urlbox">${esc(edit)}</div>
      <button class="btn ghost" data-act="copy" data-v="${esc(edit)}">編集用URLをコピー</button>
    </div>
    <button class="btn primary" data-act="openQuiz">診断ページを開く</button>
    ${S.toast ? `<p class="muted small" style="text-align:center;margin:0">${esc(S.toast)}</p>` : ""}
  </div>`;
}

function vStats() {
  const t = S.stats;
  const head = `<button class="link" data-act="home">戻る</button>
  <h2 style="font-size:24px;margin:8px 0 4px">みんなの一致率</h2>
  <p class="muted small" style="margin:0 0 16px">出題者のあなただけが見られます。誰がどう答えたかは記録していません。</p>`;
  if (!t) return head + (S.err ? `<p class="err">${esc(S.err)}</p>` : `<p class="muted">読み込み中…</p>`);
  const sum = `<div class="card" style="display:flex;justify-content:space-around;text-align:center;margin-bottom:16px">
    <div><div style="font-size:26px;font-weight:900">${t.people}</div><div class="muted small">挑戦した人</div></div>
    <div><div style="font-size:26px;font-weight:900">${t.attempts}</div><div class="muted small">挑戦回数</div></div>
    <div><div style="font-size:26px;font-weight:900">${t.avg ?? "-"}<span style="font-size:14px">${t.avg == null ? "" : "%"}</span></div><div class="muted small">平均理解度</div></div>
  </div>`;
  if (t.people < t.minPeople) return head + sum + `<div class="card muted">問題ごとの一致率は、${t.minPeople}人以上が挑戦すると表示されます（今は${t.people}人）。少人数だと、誰がどう答えたか推測できてしまうためです。</div>`;
  const shown = t.rows.filter((r) => r.rate != null).sort((a, b) => a.rate - b.rate);
  const few = t.rows.length - shown.length;
  return head + sum + `
  <p class="muted small" style="margin:0 0 10px">一致率が低い順。低い問題は、あなたの答えが意外と伝わっていないところです。</p>
  <div class="stack" style="gap:8px">${shown.map((r) => `
    <div class="card" style="padding:12px 14px">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline">
        <span style="font-weight:700">${esc(r.q)}</span>
        <span style="font-size:20px;font-weight:900;color:${r.rate < 50 ? "var(--pink)" : "var(--mint)"};white-space:nowrap">${r.rate}<span style="font-size:12px">%</span></span>
      </div>
      <div style="height:6px;background:var(--line);border-radius:3px;margin:8px 0 6px"><div style="height:6px;width:${r.rate}%;background:${r.rate < 50 ? "var(--pink)" : "var(--mint)"};border-radius:3px"></div></div>
      <span class="muted" style="font-size:12px">あなたの答え：${esc(r[r.answer])}・出題${r.asked}回</span>
    </div>`).join("")}</div>
  ${few ? `<p class="muted small" style="margin-top:12px">出題が${t.minAsked}回未満の${few}問は、まだ表示していません。</p>` : ""}`;
}

function render() {
  const v = {
    loading: () => `<p class="muted" style="text-align:center;margin-top:80px">読み込み中…</p>`,
    error: () => `<div class="card" style="margin-top:60px;text-align:center"><p style="margin:0 0 8px">${esc(S.err)}</p><a class="link" href="${esc(baseUrl())}">トップへ</a></div>`,
    landing: vLanding, home: vHome, quiz: vQuiz, sending: vSending, result: vResult,
    ranking: vRanking, detail: vDetail, edit: vEdit, created: vCreated, stats: vStats,
  }[S.view];
  $app.innerHTML = v();
}

// ---------- actions ----------
function newEditor(z) {
  const pool = POOL.map(([q, a, b, cat]) => ({ q, a, b, cat, custom: false }));
  const sel = {};
  (z ? z.questions : []).forEach((x) => {
    if (!pool.some((p) => p.q === x.q)) pool.push({ q: x.q, a: x.a, b: x.b, cat: "オリジナル", custom: true });
    sel[x.q] = x.answer;
  });
  return { id: z ? z.id : null, creator: z ? z.creator : "", pool, sel, onlySel: false, nq: { q: "", a: "", b: "" }, busy: false };
}

async function loadRanking() {
  go("ranking", { ranking: null });
  try { S.ranking = (await api("ranking", { id: S.id })).rows; } catch (e) { S.ranking = []; S.err = e.message; }
  if (S.view === "ranking") render();
}

async function showHistory(name, back) {
  go("detail", { detail: { name, data: null, back } });
  try {
    S.detail.data = await api("history", { id: S.id, name });
    if (!S.detail.data.length) S.err = "まだ記録がありません。";
  } catch (e) { S.err = e.message; }
  render();
}

async function submit() {
  go("sending");
  try {
    const r = await api("submit", { token: S.token, answers: S.answers, playerKey: playerKey() });
    go("result", { result: r });
  } catch (e) { setErr(e); }
}

const ACT = {
  landing: () => { history.replaceState(null, "", baseUrl()); go("landing", { id: null, quiz: null }); },
  newQuiz: () => go("edit", { ed: newEditor(null) }),
  home: () => go(S.quiz ? "home" : "landing"),
  start: async (el) => {
    const n = S.name.trim();
    if (!n) { go("home", { confirm: "" }); S.err = "名前を入力してください。"; return render(); }
    // 確認画面のあとで名前を書き換えた場合は、もう一度確認する
    const takeover = !!el.dataset.takeover && S.confirm === n;
    go("loading", { confirm: "" });
    try {
      const r = await api("start", { id: S.id, name: n, playerKey: playerKey(), takeover });
      if (r.confirm) return go("home", { confirm: n });
      saveName(S.id, n);
      go("quiz", { idx: 0, answers: [], questions: r.questions, token: r.token });
    } catch (e) { go("home"); setErr(e); }
  },
  cancelConfirm: () => { go("home", { confirm: "" }); document.getElementById("nm")?.select(); },
  prev: () => { S.idx--; render(); },
  choose: (el) => {
    S.answers[S.idx] = el.dataset.k;
    if (S.idx < S.questions.length - 1) { S.idx++; render(); } else submit();
  },
  resend: submit,
  ranking: loadRanking,
  detail: (el) => showHistory(S.ranking[+el.dataset.i].name, "ranking"),
  backResult: () => go("result"),
  myHistory: () => showHistory(S.result.name, "result"),
  editQuiz: async () => {
    go("loading");
    try { const z = await api("getQuizForEdit", { id: S.id, editKey: keyFor(S.id) }); go("edit", { ed: newEditor(z) }); }
    catch (e) { go("home"); setErr(e); }
  },
  stats: async () => {
    go("stats", { stats: null });
    try { S.stats = await api("stats", { id: S.id, editKey: keyFor(S.id) }); } catch (e) { S.err = e.message; }
    if (S.view === "stats") render();
  },
  onlySel: () => { S.ed.onlySel = !S.ed.onlySel; render(); },
  toggle: (el) => {
    const e = S.ed, p = e.pool[+el.dataset.i];
    if (p.q in e.sel) delete e.sel[p.q]; else e.sel[p.q] = "";
    render();
  },
  setAns: (el) => { const p = S.ed.pool[+el.dataset.i]; S.ed.sel[p.q] = el.dataset.k; render(); },
  delCustom: (el) => { const e = S.ed, p = e.pool[+el.dataset.i]; e.pool.splice(+el.dataset.i, 1); delete e.sel[p.q]; render(); },
  addCustom: () => {
    const e = S.ed, q = e.nq.q.trim(), a = e.nq.a.trim(), b = e.nq.b.trim();
    if (!q || !a || !b) { S.err = "質問と選択肢A・Bをすべて入力してください。"; return render(); }
    if (e.pool.some((p) => p.q === q)) { S.err = "同じ質問がすでにあります。"; return render(); }
    e.pool.push({ q, a, b, cat: "オリジナル", custom: true });
    e.sel[q] = "";
    e.nq = { q: "", a: "", b: "" }; S.err = ""; render();
  },
  saveQuiz: async () => {
    const e = S.ed;
    if (!e.creator.trim()) { S.err = "あなたの名前を入力してください。"; return render(); }
    e.busy = true; S.err = ""; render();
    const questions = e.pool.filter((p) => p.q in e.sel).map((p) => ({ q: p.q, a: p.a, b: p.b, answer: e.sel[p.q] }));
    try {
      let id = e.id, key = id ? keyFor(id) : null;
      if (id) await api("updateQuiz", { id, editKey: key, creator: e.creator, questions });
      else ({ id, editKey: key } = await api("createQuiz", { creator: e.creator, questions }));
      saveMine(id, e.creator.trim(), key);
      S.id = id; S.quiz = null;
      go("created", { created: { id, key, creator: e.creator.trim(), updated: !!e.id }, toast: "" });
    } catch (err) { e.busy = false; setErr(err); }
  },
  copy: async (el) => { S.toast = (await copy(el.dataset.v)) ? "コピーしました" : "コピーできませんでした。長押しで選択してください。"; render(); },
  openQuiz: () => { location.href = quizUrl(S.created.id); },
};

$app.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-act]");
  if (!el || el.disabled) return;
  ACT[el.dataset.act]?.(el);
});
$app.addEventListener("input", (ev) => {
  const b = ev.target.dataset.bind; if (!b) return;
  const path = b.split("."), last = path.pop();
  path.reduce((o, k) => o[k], S)[last] = ev.target.value;
});

// ---------- boot ----------
(async function boot() {
  const params = new URLSearchParams(location.search);
  S.id = params.get("q");
  const k = new URLSearchParams(location.hash.slice(1)).get("k");
  if (location.hash) history.replaceState(null, "", location.pathname + location.search);
  if (!S.id) return go("landing");
  S.name = nameFor(S.id);
  try {
    S.quiz = await api("getQuiz", { id: S.id });
    if (k) saveMine(S.id, S.quiz.creator, k);
    document.title = S.quiz.creator + "さん｜" + QUIZ_TITLE;
    go("home");
  } catch (e) { go("error", {}); S.err = e.message; render(); }
})();
</script>
</body>
</html>
